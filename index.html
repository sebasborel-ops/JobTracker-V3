<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker V3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>JobTracker V3</h1>
</header>

<section class="dashboard">
    <div class="stat">
        <h3>Total</h3>
        <span id="totalCount">0</span>
    </div>

    <div class="stat">
        <h3>Envoyées</h3>
        <span id="sentCount">0</span>
    </div>

    <div class="stat">
        <h3>Entretiens</h3>
        <span id="interviewCount">0</span>
    </div>

    <div class="stat">
        <h3>Offres</h3>
        <span id="offerCount">0</span>
    </div>
</section>

<section class="form-section">
    <h2>Nouvelle candidature</h2>

    <input id="employer" placeholder="Employeur">
    <input id="position" placeholder="Poste">
    <input id="grade" placeholder="Grade">

    <input id="location" placeholder="Localisation">
    <input id="source" placeholder="Source">

    <input id="deadline" type="date">
    <input id="applicationDate" type="date">

    <input id="preInterview" type="date">
    <input id="writtenTest" type="date">
    <input id="interviewDate" type="date">

    <input id="jobLink" placeholder="Lien de l'offre">

    <select id="result">
        <option>En attente</option>
        <option>Refus</option>
        <option>Liste d'attente</option>
        <option>Offre reçue</option>
        <option>Offre acceptée</option>
        <option>Candidature retirée</option>
    </select>

    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="addCandidate()">Ajouter</button>
</section>

<section id="cardsContainer" class="cards-container"></section>

<div class="actions">
    <button onclick="exportData()">Export JSON</button>

    <input type="file" id="importFile" onchange="importData(event)">
</div>

<script src="app.js"></script>

</body>
</html>
