
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTracker V3</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>JobTracker V3</h1>
</header>

<section class="dashboard">

    <div class="stat">
        <strong>Total</strong>
        <span id="totalCount">0</span>
    </div>

    <div class="stat">
        <strong>Envoyées</strong>
        <span id="sentCount">0</span>
    </div>

    <div class="stat">
        <strong>Entretiens</strong>
        <span id="interviewCount">0</span>
    </div>

    <div class="stat">
        <strong>Offres</strong>
        <span id="offerCount">0</span>
    </div>

</section>

<section class="form-section">

<h2>Nouvelle candidature</h2>

<div class="form-grid">

<div class="field">
<label>Employeur</label>
<input id="employer" type="text">
</div>

<div class="field">
<label>Poste</label>
<input id="position" type="text">
</div>

<div class="field">
<label>Grade</label>
<input id="grade" type="text">
</div>

<div class="field">
<label>Localisation</label>
<input id="location" type="text">
</div>

<div class="field">
<label>Source</label>
<input id="source" type="text">
</div>

<div class="field">
<label>Lien offre</label>
<input id="jobLink" type="text">
</div>

<div class="field">
<label>Date limite candidature</label>
<input id="deadline" type="date">
</div>

<div class="field">
<label>Date candidature</label>
<input id="applicationDate" type="date">
</div>

<div class="field">
<label>Pré-entretien</label>
<input id="preInterview" type="date">
</div>

<div class="field">
<label>Test écrit</label>
<input id="writtenTest" type="date">
</div>

<div class="field">
<label>Entretien</label>
<input id="interviewDate" type="date">
</div>

<div class="field">
<label>Résultat</label>
<select id="result">
<option>En attente</option>
<option>Refus</option>
<option>Liste d'attente</option>
<option>Offre reçue</option>
<option>Offre acceptée</option>
<option>Candidature retirée</option>
</select>
</div>

</div>

<label>Notes</label>
<textarea id="notes" rows="3"></textarea>

<button class="add-btn" onclick="addCandidate()">
+ Ajouter
</button>

</section>

<section id="cardsContainer" class="cards-container"></section>

<div class="actions">
<button onclick="exportData()">Export JSON</button>
<input type="file" id="importFile" onchange="importData(event)">
</div>

<script src="app.js"></script>

</body>
</html>
